<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Constellations — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EV9PPQDPCS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EV9PPQDPCS');
  </script>
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .title-icon {
      height: 1em;
      width: auto;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }

    nav a:hover, nav a.active {
      border-bottom-color: #fff;
    }

    /* ── Gallery ── */
    .gallery-status {
      text-align: center;
      padding: 2rem 1rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 300;
      color: #ccc;
    }

    .gallery-status a {
      color: #ddd;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .gallery-status a:hover {
      color: #fff;
    }

    .sort-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem 0.5rem;
    }

    .sort-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 2px;
      color: #ccc;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      padding: 0.4rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sort-btn:hover {
      border-color: #555;
      color: #fff;
    }

    .sort-btn.active {
      border-color: #64faed;
      color: #64faed;
    }

    .voting-notice {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 300;
      font-style: italic;
      color: #888;
      padding: 0.3rem 1rem 0.5rem;
    }

    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: #333;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #0a0a0a;
    }

    .card-body {
      padding: 0.8rem 1rem;
    }

    .card-title {
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
      color: #fff;
      line-height: 1.4;
    }

    .card-title .name {
      font-weight: 400;
    }

    .card-title .author {
      font-weight: 300;
      color: #888;
      font-size: 0.8rem;
    }

    .card-slice {
      font-size: 0.75rem;
      font-weight: 300;
      color: #666;
      margin-bottom: 0.6rem;
    }

    .card-votes {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .vote-score {
      font-size: 0.85rem;
      font-weight: 400;
      color: #aaa;
    }

    .card-download {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 300;
      color: #64faed;
      text-decoration: none;
      border: 1px solid #333;
      border-radius: 2px;
      padding: 0.25rem 0.5rem;
      transition: all 0.2s;
    }

    .card-download:hover {
      border-color: #64faed;
      background: rgba(100, 250, 237, 0.1);
    }

    /* ── Loading / Empty ── */
    .gallery-message {
      text-align: center;
      padding: 6rem 2rem;
      font-size: 1.1rem;
      font-weight: 300;
      color: #666;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        padding: 1rem;
        gap: 1rem;
      }
    }

    .site-footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      font-weight: 300;
      color: #555;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <header>
    <h1><img src="media/gc-fish.svg" alt="" class="title-icon">Galactic Constellations</h1>
    <nav>
      <a href="index.html">Find constellations</a>
      <a href="gallery.html" class="active">See others</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <p class="gallery-status" id="status">Loading gallery…</p>
  <div class="sort-toggle" id="sortToggle" style="display:none;">
    <button class="sort-btn active" id="sortTop">Top discoveries</button>
    <button class="sort-btn" id="sortRandom">Random</button>
    <button class="sort-btn" id="sortNew">New discoveries</button>
  </div>
  <p class="voting-notice">This site is now an archive. Submissions and voting are closed.</p>
  <main class="gallery" id="gallery"></main>

  <script src="archive/constellations.js"></script>
  <script>
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const sortToggle = document.getElementById('sortToggle');
    const ARCHIVE_DIR = 'archive/constellations/';

    let allEntries = [];
    let currentSort = 'top'; // 'top' | 'new' | 'random'

    const sortButtons = {
      top: document.getElementById('sortTop'),
      random: document.getElementById('sortRandom'),
      new: document.getElementById('sortNew')
    };

    // ── Sort toggle ──
    function setSort(mode) {
      if (currentSort === mode && mode !== 'random') return;
      currentSort = mode;
      Object.values(sortButtons).forEach(btn => btn.classList.remove('active'));
      sortButtons[mode].classList.add('active');
      renderGallery();
    }

    sortButtons.top.addEventListener('click', () => setSort('top'));
    sortButtons.random.addEventListener('click', () => setSort('random'));
    sortButtons.new.addEventListener('click', () => setSort('new'));

    // ── Render with current sort ──
    function renderGallery() {
      const sorted = [...allEntries];
      if (currentSort === 'top') {
        sorted.sort((a, b) => {
          if (b.netVotes !== a.netVotes) return b.netVotes - a.netVotes;
          return b.createdAt - a.createdAt;
        });
      } else if (currentSort === 'new') {
        sorted.sort((a, b) => b.createdAt - a.createdAt);
      } else {
        // Fisher-Yates shuffle
        for (let i = sorted.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
        }
      }

      gallery.innerHTML = '';
      sorted.forEach(entry => gallery.appendChild(createCard(entry)));
    }

    // ── Load and render ──
    function loadGallery() {
      try {
        const data = window.ARCHIVE_ENTRIES;

        allEntries = data.map(d => ({
          ...d,
          netVotes: (d.upvotes || 0) - (d.downvotes || 0),
          createdAt: d.createdAt ? Date.parse(d.createdAt) : 0
        }));

        status.innerHTML = `${allEntries.length} constellation${allEntries.length !== 1 ? 's' : ''} found within <a href="https://data.desi.lbl.gov/doc/releases/dr1/" target="_blank" rel="noopener">DESI's DR1</a>`;
        sortToggle.style.display = 'flex';
        renderGallery();

      } catch (err) {
        console.error('Failed to load gallery:', err);
        status.textContent = 'Failed to load gallery.';
      }
    }

    function parseName(fname) {
      const m = fname.match(/ra([\d.-]+)_dec([\d.-]+)_z([\d.]+)_size_([\d.]+)\.png/);
      if (!m) return null;
      return { ra: m[1], dec: m[2], z: m[3], size: m[4] };
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ── Create a card ──
    function createCard(entry) {
      const card = document.createElement('div');
      card.className = 'card';

      const p = parseName(entry.sourceImage || '');
      const sliceText = p ? `${p.size} Mpc/h slice · z=${p.z}  RA=${p.ra}  DEC=${p.dec}` : '';
      const src = ARCHIVE_DIR + encodeURIComponent(entry.fileName);
      const name = escapeHtml(entry.constellationName || 'Untitled');
      const author = escapeHtml(entry.astronomerName || 'Anonymous');

      card.innerHTML = `
        <img class="card-img" src="${src}" alt="${name}" loading="lazy" />
        <div class="card-body">
          <div class="card-title"><span class="name">"${name}"</span> <span class="author">found by ${author}</span></div>
          ${sliceText ? `<div class="card-slice">${sliceText}</div>` : ''}
          <div class="card-votes">
            <span class="vote-score" title="Final score">&#9650; ${entry.netVotes}</span>
            <a class="card-download" href="${src}" download="${escapeHtml(entry.fileName)}">Download</a>
          </div>
        </div>
      `;

      return card;
    }

    loadGallery();
  </script>
  <footer class="site-footer">Created by Claire Lamman · © 2026<br>This site uses cookies for anonymous analytics</footer>
</body>
</html>
