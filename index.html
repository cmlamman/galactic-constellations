<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Constellations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .title-icon {
      height: 1em;
      width: auto;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }

    nav a:hover, nav a.active {
      border-bottom-color: #fff;
    }

    .page {
      display: flex;
      gap: 2.5rem;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    .left {
      flex: 1;
      min-width: 0;
    }

    .right {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      padding-top: 0.25rem;
    }

    .draw-instruction {
      font-size: 1.2rem;
      font-weight: 300;
      color: #555;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      cursor: crosshair;
      overflow: hidden;
    }

    .canvas-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .canvas-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .image-caption {
      margin-top: 0.75rem;
      font-size: 1.1rem;
      font-weight: 300;
      color: #ccc;
      letter-spacing: 0.02em;
    }

    .image-caption a {
      color: #ccc;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .image-caption a:hover {
      color: #fff;
    }

    .image-subcaption {
      margin-top: 0.3rem;
      font-size: 1.0rem;
      font-weight: 300;
      color: #999;
      letter-spacing: 0.02em;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid #333;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: #1a1a1a;
      border-color: #555;
    }

    .divider {
      border: none;
      border-top: 1px solid #1a1a1a;
      margin: 0.4rem 0;
    }

    .share-section {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      transition: opacity 0.3s;
    }

    .share-section.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .share-section h3 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
    }

    .share-section input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: #fff;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    .share-section input::placeholder { color: #555; }
    .share-section input:focus { border-color: #666; }

    .btn-submit {
      background: #64faed;
      border-color: #64faed;
      color: #000;
    }

    .btn-submit:hover {
      background: #8bfcf2;
      border-color: #8bfcf2;
      color: #000;
    }

    .btn-submit:disabled {
      background: #1a4a47;
      border-color: #1a4a47;
      color: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-download {
      background: transparent;
      border-color: #64faed;
      color: #64faed;
    }

    .btn-download:hover {
      background: rgba(100, 250, 237, 0.1);
      border-color: #8bfcf2;
      color: #8bfcf2;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 0.8rem 1.6rem;
      font-size: 0.85rem;
      border-radius: 3px;
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .page { flex-direction: column; padding: 1rem; }
      .right {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .right .btn { width: auto; flex: 1; min-width: 100px; }
      .share-section { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1><img src="gc-fish.svg" alt="" class="title-icon">Galactic Constellations</h1>
    <nav>
      <a href="index.html" class="active">Find constellations</a>
      <a href="gallery.html">See others</a>
    </nav>
  </header>

  <main class="page">
    <section class="left">
      <p class="draw-instruction">Draw your constellation below</p>
      <div class="canvas-wrap" id="canvasWrap">
        <img id="sliceImg" alt="Galaxy slice" />
        <canvas id="drawCanvas"></canvas>
      </div>
      <p class="image-caption" id="caption">Loading…</p>
      <p class="image-subcaption" id="subcaption"></p>
    </section>

    <aside class="right">
      <button class="btn" id="btnNew">New slice</button>
      <button class="btn" id="btnRotate">Rotate</button>
      <button class="btn" id="btnUndo">Undo</button>

      <hr class="divider">

      <div class="share-section disabled" id="shareSection">
        <h3>Share my constellation</h3>
        <input type="text" id="constellationName" placeholder="Constellation name" maxlength="30" />
        <input type="text" id="astronomerName" placeholder="Astronomer name" maxlength="30" />
        <button class="btn btn-submit" id="btnSubmit">Submit</button>
        <button class="btn btn-download" id="btnDownload">Download</button>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK (compat builds for plain script usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // ── Firebase ──
    firebase.initializeApp({
      apiKey: "AIzaSyDwMgQ53YGwDWL1IhhkBbsIvauALELvpMY",
      authDomain: "galactic-constellations.firebaseapp.com",
      projectId: "galactic-constellations",
      storageBucket: "galactic-constellations.firebasestorage.app",
      messagingSenderId: "761744782436",
      appId: "1:761744782436:web:749b09fe749f9548bc5b71",
      measurementId: "G-EV9PPQDPCS"
    });
    const storage = firebase.storage();
    const db = firebase.firestore();
    const MAX_SUBMISSIONS = 2000;
    const RATE_LIMIT_MS = 60000;
    let lastSubmitTime = 0;
    let lastSubmittedKey = '';
    let lastDownloadedKey = '';

    // ── State ──
    let imageList = [];
    let currentFile = '';
    let rotation = 0;
    let strokes = [];
    let currentStroke = null;
    let isDrawing = false;
    let hasDrawn = false;

    const img       = document.getElementById('sliceImg');
    const canvas    = document.getElementById('drawCanvas');
    const ctx       = canvas.getContext('2d');
    const caption   = document.getElementById('caption');
    const subcaption = document.getElementById('subcaption');
    const share     = document.getElementById('shareSection');
    const toast     = document.getElementById('toast');
    const btnSubmit = document.getElementById('btnSubmit');

    // ── Load image list ──
    async function init() {
      try {
        const res = await fetch('web-images/images.json');
        imageList = await res.json();
      } catch {
        caption.textContent = 'Could not load image list. Make sure web-images/images.json exists.';
        return;
      }
      loadRandomSlice();
    }

    function parseName(fname) {
      const m = fname.match(/ra([\d.-]+)_dec([\d.-]+)_z([\d.]+)_size_([\d.]+)\.png/);
      if (!m) return null;
      return { ra: m[1], dec: m[2], z: m[3], size: m[4] };
    }

    function loadRandomSlice() {
      if (!imageList.length) return;
      currentFile = imageList[Math.floor(Math.random() * imageList.length)];
      rotation = [0, 90, 180, 270][Math.floor(Math.random() * 4)];
      strokes = [];
      hasDrawn = false;
      lastSubmittedKey = '';
      lastDownloadedKey = '';
      share.classList.add('disabled');
      document.getElementById('constellationName').value = '';
      document.getElementById('astronomerName').value = '';
      img.src = 'web-images/' + currentFile;
      img.style.transform = `rotate(${rotation}deg)`;
      updateCaption();
      img.onload = () => resizeCanvas();
    }

    function updateCaption() {
      const p = parseName(currentFile);
      if (p) {
        caption.innerHTML = `${p.size} Mpc/h slice from <a href="https://data.desi.lbl.gov/doc/releases/dr1/" target="_blank" rel="noopener">DESI DR1</a>`;
        subcaption.textContent = `Centered at z=${p.z}  RA=${p.ra}  DEC=${p.dec}`;
      } else {
        caption.textContent = currentFile;
        subcaption.textContent = '';
      }
    }

    // ── Canvas ──
    function resizeCanvas() {
      const wrap = document.getElementById('canvasWrap');
      canvas.width  = wrap.offsetWidth;
      canvas.height = wrap.offsetHeight;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) / rect.width, y: (cy - rect.top) / rect.height };
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); moveDraw(e); },  { passive: false });
    canvas.addEventListener('touchend', endDraw);

    function startDraw(e) { isDrawing = true; currentStroke = [getPos(e)]; }

    function moveDraw(e) {
      if (!isDrawing) return;
      currentStroke.push(getPos(e));
      redraw();
    }

    function endDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke && currentStroke.length > 1) {
        strokes.push(currentStroke);
        hasDrawn = true;
        share.classList.remove('disabled');
      }
      currentStroke = null;
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width, h = canvas.height;
      function drawStroke(pts) {
        if (pts.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].x * w, pts[0].y * h);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x * w, pts[i].y * h);
        ctx.strokeStyle = 'rgba(100, 250, 237, 0.6)';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      strokes.forEach(drawStroke);
      if (currentStroke) drawStroke(currentStroke);
    }

    // ── Buttons ──
    document.getElementById('btnRotate').addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      img.style.transform = `rotate(${rotation}deg)`;
    });

    document.getElementById('btnNew').addEventListener('click', loadRandomSlice);

    document.getElementById('btnUndo').addEventListener('click', () => {
      if (strokes.length) {
        strokes.pop();
        if (!strokes.length) { hasDrawn = false; share.classList.add('disabled'); }
        redraw();
      }
    });

    // Ctrl+Z / Cmd+Z undo
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (strokes.length) {
          strokes.pop();
          if (!strokes.length) { hasDrawn = false; share.classList.add('disabled'); }
          redraw();
        }
      }
      if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey) {
        // Don't trigger if user is typing in an input
        if (document.activeElement.tagName === 'INPUT') return;
        loadRandomSlice();
      }
    });

    // ── Compose final image ──
    function compositeImage() {
      return new Promise(resolve => {
        const out = document.createElement('canvas');
        const wrap = document.getElementById('canvasWrap');
        out.width  = wrap.offsetWidth;
        out.height = wrap.offsetHeight;
        const octx = out.getContext('2d');

        octx.save();
        octx.translate(out.width / 2, out.height / 2);
        octx.rotate((rotation * Math.PI) / 180);
        octx.drawImage(img, -out.width / 2, -out.height / 2, out.width, out.height);
        octx.restore();

        strokes.forEach(pts => {
          if (pts.length < 2) return;
          octx.beginPath();
          octx.moveTo(pts[0].x * out.width, pts[0].y * out.height);
          for (let i = 1; i < pts.length; i++) octx.lineTo(pts[i].x * out.width, pts[i].y * out.height);
          octx.strokeStyle = 'rgba(100, 250, 237, 0.6)';
          octx.lineWidth = 8;
          octx.lineCap = 'round';
          octx.lineJoin = 'round';
          octx.stroke();
        });

        out.toBlob(blob => resolve(blob), 'image/png');
      });
    }

    // ── Compose image with caption text at bottom ──
    function compositeImageWithText() {
      return new Promise(resolve => {
        const wrap = document.getElementById('canvasWrap');
        const imgW = wrap.offsetWidth;
        const imgH = wrap.offsetHeight;
        const p = parseName(currentFile);
        const cName = document.getElementById('constellationName').value.trim();
        const aName = document.getElementById('astronomerName').value.trim();

        // Text layout — two lines max
        const fontSize = Math.round(imgW * 0.028);
        const titleFontSize = Math.round(fontSize * 1.15);
        const padding = Math.round(fontSize * 0.8);
        const lineHeight = Math.round(fontSize * 1.6);

        // Line 1: "Title" by Author
        let line1 = '';
        if (cName && aName) line1 = `"${cName}" found by ${aName}`;
        else if (cName) line1 = `"${cName}"`;
        else if (aName) line1 = `found by ${aName}`;

        // Line 2: size + coordinates combined
        let line2 = '';
        if (p) line2 = `${p.size} Mpc/h slice from DESI DR1 · Centered at z=${p.z}  RA=${p.ra}  DEC=${p.dec}`;

        const numLines = (line1 ? 1 : 0) + (line2 ? 1 : 0);
        const textBlockH = numLines * lineHeight + padding * 2;

        const out = document.createElement('canvas');
        out.width = imgW;
        out.height = imgH + textBlockH;
        const octx = out.getContext('2d');

        // Black background
        octx.fillStyle = '#000';
        octx.fillRect(0, 0, out.width, out.height);

        // Draw rotated image
        octx.save();
        octx.translate(imgW / 2, imgH / 2);
        octx.rotate((rotation * Math.PI) / 180);
        octx.drawImage(img, -imgW / 2, -imgH / 2, imgW, imgH);
        octx.restore();

        // Draw strokes
        strokes.forEach(pts => {
          if (pts.length < 2) return;
          octx.beginPath();
          octx.moveTo(pts[0].x * imgW, pts[0].y * imgH);
          for (let i = 1; i < pts.length; i++) octx.lineTo(pts[i].x * imgW, pts[i].y * imgH);
          octx.strokeStyle = 'rgba(100, 250, 237, 0.6)';
          octx.lineWidth = 8;
          octx.lineCap = 'round';
          octx.lineJoin = 'round';
          octx.stroke();
        });

        // Draw text
        octx.textAlign = 'left';
        let curLine = 0;
        if (line1) {
          octx.fillStyle = '#fff';
          octx.font = `400 ${titleFontSize}px 'DM Sans', sans-serif`;
          octx.fillText(line1, padding, imgH + padding + (curLine + 1) * lineHeight - fontSize * 0.3);
          curLine++;
        }
        if (line2) {
          octx.fillStyle = '#aaa';
          octx.font = `300 ${fontSize}px 'DM Sans', sans-serif`;
          octx.fillText(line2, padding, imgH + padding + (curLine + 1) * lineHeight - fontSize * 0.3);
        }

        out.toBlob(blob => resolve(blob), 'image/png');
      });
    }

    // ── Download button ──
    document.getElementById('btnDownload').addEventListener('click', async () => {
      const cName = document.getElementById('constellationName').value.trim();
      const aName = document.getElementById('astronomerName').value.trim();
      const downloadKey = `${currentFile}|${cName}|${aName}|${rotation}|${strokes.length}`;
      if (downloadKey === lastDownloadedKey) {
        showToast('Already downloaded!');
        return;
      }

      const blob = await compositeImageWithText();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      const base = currentFile.replace('.png', '');
      const safeCName = cName ? '_' + cName.replace(/[^a-zA-Z0-9_-]/g, '_') : '';
      link.download = `${base}${safeCName}.png`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
      lastDownloadedKey = downloadKey;
      showToast('Image downloaded!');
    });

    // ── Check how many submissions exist ──
    async function getSubmissionCount() {
      try {
        const snapshot = await db.collection('constellations').get();
        return snapshot.size;
      } catch (err) {
        console.error('Count check failed:', err);
        return -1;
      }
    }

    // ── Submit ──
    btnSubmit.addEventListener('click', async () => {
      const cName = document.getElementById('constellationName').value.trim();
      const aName = document.getElementById('astronomerName').value.trim();

      if (!cName || !aName) { showToast('Please fill in both fields.'); return; }

      // Check for duplicate submission
      const submitKey = `${currentFile}|${cName}|${aName}`;
      if (submitKey === lastSubmittedKey) {
        showToast('Already submitted!');
        return;
      }

      // Rate limit
      const now = Date.now();
      if (now - lastSubmitTime < RATE_LIMIT_MS) {
        const wait = Math.ceil((RATE_LIMIT_MS - (now - lastSubmitTime)) / 1000);
        showToast(`Please wait ${wait}s before submitting again.`);
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Uploading…';

      try {
        // Check cap
        const count = await getSubmissionCount();
        if (count >= MAX_SUBMISSIONS) {
          showToast('Gallery is full — no more submissions accepted.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Submit';
          return;
        }

        // Build filename
        const base = currentFile.replace('.png', '');
        const safeCName = cName.replace(/[^a-zA-Z0-9_-]/g, '_');
        const safeAName = aName.replace(/[^a-zA-Z0-9_-]/g, '_');
        const outName = `${base}_${safeCName}_${safeAName}.png`;

        // Upload image
        const blob = await compositeImage();
        const ref = storage.ref(`generated-constellations/${outName}`);
        await ref.put(blob, {
          contentType: 'image/png',
          customMetadata: {
            constellationName: cName,
            astronomerName: aName,
            sourceImage: currentFile,
            rotation: String(rotation)
          }
        });

        // Get download URL and create Firestore entry
        const imageUrl = await ref.getDownloadURL();
        await db.collection('constellations').doc(outName).set({
          constellationName: cName,
          astronomerName: aName,
          sourceImage: currentFile,
          imageUrl: imageUrl,
          fileName: outName,
          upvotes: 0,
          downvotes: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        lastSubmitTime = Date.now();
        lastSubmittedKey = submitKey;
        showToast('Constellation uploaded!');

      } catch (err) {
        console.error('Upload failed:', err);
        showToast('Upload failed — please try again.');
      }

      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Submit';
    });

    // ── Toast ──
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
